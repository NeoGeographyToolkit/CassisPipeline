# cassis_common.conf - shared recipe constants, the same for every site. Sourced after the
# per-site config. These are bash assignments. Edit with care.
mapprojRes=4.59      # framelet mapproject + correlate grid (native ~4.59 m)
demRes=18            # point2dem / DEM / mosaic grid (m)
corrRes=18           # DEM-vs-CTX hillshade-correlation grid (bootstrap + evaluation)
corrSearch=25        # DEM-vs-CTX correlation search radius (px)
htUncLoose=200       # first BA heights-from-dem uncertainty (m): loose height, so the fixed GCP drives the horizontal fit
htUncTight=10        # second BA heights-from-dem uncertainty (m): relaxed to 10 (1 was too tight; caused seams/local tilts). Matches cassis.rst.
camPosUnc=500,500    # camera-position-uncertainty (m, x,y)
robust=0.5           # BA robust threshold (matches cassis.rst)
gcpSigma=1           # dem2gcp GCP sigma (matters only when the TIC floats the GCP, i.e. ticFixGcp=no)
ticFixGcp=yes        # TIC GCP mode: yes = --fix-gcp-xyz (hard pin, gcpSigma ignored); no = float GCP (soft, gcpSigma weights). Set no + larger gcpSigma when a hard fix-gcp is infeasible (noisy linescan->CTX GCP0 breaks framelet continuity)
gcpRobust=           # OPT-IN (default empty/off): robust cost on the floated-GCP residuals (bundle_adjust --gcp-robust-threshold), in gcp-sigma units. Meaningful only with ticFixGcp=no. Attenuates (does not clip) noisy/wrong boot GCPs so consistent control still pulls and the dense ties keep framelet continuity. Try ~4.
maxGcp=200000        # dem2gcp GCP cap
maxDisp=50           # dem2gcp --max-disp: flag a boot-disparity GCP whose NORM exceeds this, in PIXELS of the corrRes grid (NOT meters). Default 50 is far looser than the ~3 px signal, so it rarely bites; on low-texture sites the bad GCPs are small-magnitude, so tighten the texture filter below instead.
# gcpTextureMin: OPT-IN low-texture GCP filter (default empty/off = shipped behavior). When set to a
# number, cassis_pass.sh masks the boot disparity where the local linescan-hillshade std (window
# gcpTextureWin px) is below it, so dem2gcp places NO control on featureless ground (where the hillshade
# correlation is unreliable) and the dense same-look ties keep continuity. Typical ~5 (masks the
# featureless half of a flat strip top). gcpTextureWin default 15.
gcpTextureMin=       # empty = off
gcpTextureWin=15
geounc=0             # stereo mapproj-geolocation-uncertainty (px); 0 avoids spurious matches from an over-grown collar
# The optimized and fixed transverse-distortion lens (20 coefficients), a global
# CaSSIS instrument constant. Used by stage 5 (cam_gen --distortion).
# 2026-09-05: NO-TILT re-solve (unc10_relax): joint 3-site GCP-only fit with the transverse CONSTANT
# terms (idx 0,10) nailed to the near-identity refit, so no optical-center/lateral gauge drift. This
# replaces the old jfg lens (idx0 -10.80, idx10 1.11) whose huge constants forced pose tilt. Same shape
# (x-scale ~0.98, y-scale ~0.72) minus the gauge junk.
optimized_distortion="0.0008740413368476237 0.9816137390269586 0.06295184484436767 6.503303322339262e-05 0.00018991361428280054 0.005421634393694636 -2.173335823361339e-05 3.066384033845343e-06 3.9223080259998016e-05 0.000188597024435428 0.019041662416607687 -0.0070985077063046575 0.7213840572486215 -0.00023938661417208874 0.0007370700782627364 -0.027023441169411282 -3.622432156263191e-06 -2.707587890260399e-05 3.659477481121951e-05 -0.0009016322088493828"
refitBeforeLinescan=no  # EXPERIMENT (default no = shipped pipeline). yes = build the linescan from the REFIT cameras (optimized transverse lens + refit pose) up front, so the linescan, its CTX registration, and the stage-7 GCP all use the refit cameras; the late refit (stages 4-5) is then a gather, not a recompute. Mechanism documented in linescan_refit_lens.py.
refitPosUnc=100,100  # stage-5 cam_gen --camera-position-uncertainty (m)
refitPixSamples=4000 # stage-5 cam_gen --num-pixel-samples
refitDatum=D_MARS    # stage-5 cam_gen --datum
num_matches_from_disp=20000  # stage-6 --num-matches-from-disparity per pair (0 = skip dense-match generation)
denseGeounc=30       # stage-6 dense L-R search collar (px); the cameras are not yet bundle-adjusted here
pass2Gcp=no_gcp      # pass2 second-BA gcp mode: no_gcp (pure vertical) or soft_gcp (pull under-constrained end framelets). Keep no_gcp unless soft_gcp is applied uniformly to every site.
